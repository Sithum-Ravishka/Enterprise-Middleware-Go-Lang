apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: user-platform
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: user-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false   # disable token mount (no K8s API calls)
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          resources:                        # ✅ requests/limits incl. storage
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "512Mi"    # ✅ storage request
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "1Gi"      # ✅ storage limit
