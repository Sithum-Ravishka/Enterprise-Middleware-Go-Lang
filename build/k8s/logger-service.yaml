---
apiVersion: v1
kind: Service
metadata:
  name: logger-service
  namespace: user-platform
spec:
  ports:
    - port: 50052
      name: grpc
  selector:
    app: logger-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger-service
  namespace: user-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger-service
  template:
    metadata:
      labels:
        app: logger-service
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "logger-service"
    spec:
      automountServiceAccountToken: false   # disable token mount
      containers:
        - name: logger-service
          image: logger-service:v1.0.0       # ✅ pinned version tag (replace with your release)
          # or use a digest:
          # image: logger-service@sha256:<IMAGE_DIGEST>
          ports:
            - containerPort: 50052
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: user_platform
            - name: KAFKA_BROKERS
              value: kafka:9093              # prefer TLS listener
            - name: VAULT_ADDR
              value: https://vault:8200      # secure vault connection
            - name: VAULT_CACERT
              value: /etc/ssl/certs/ca.crt   # trust bundle
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "512Mi"     # ✅ storage request
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "1Gi"       # ✅ storage limit
