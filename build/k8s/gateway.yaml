---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: user-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-read-pods
  namespace: user-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-read-pods-binding
  namespace: user-platform
subjects:
  - kind: ServiceAccount
    name: gateway-sa
    namespace: user-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-read-pods
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: user-platform
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: user-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway-sa
      containers:
        - name: gateway
          image: gateway:v1.0.0                 # ✅ pinned tag (replace with your release)
          ports:
            - containerPort: 8080
          env:
            - name: USER_SERVICE_HOST
              value: user-service:50051
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "1Gi"
