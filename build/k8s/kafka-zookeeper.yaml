apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: user-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      automountServiceAccountToken: false   # disable token mount
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
          ports:
            - containerPort: 9092
          resources:                 
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "1Gi"   # ✅ storage request added
            limits:
              cpu: "1000m"
              memory: "2Gi"
              ephemeral-storage: "2Gi"   # ✅ optional storage limit
