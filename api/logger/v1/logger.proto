syntax = "proto3";

package logger.v1;

option go_package = "github.com/example/user-platform/api/logger/v1;loggerpb";

// Audit logging service definition.
service LoggerService {
  rpc WriteAudit(AuditEvent) returns (WriteAuditResponse);
}

// Audit event message (new schema).
message AuditEvent {
  string id = 1;            // uuid string (generated at producer)
  int64 ts = 2;             // unix seconds (UTC)
  string log_level = 3;     // INFO|WARN|ERROR|DEBUG
  string message = 4;
  string service_name = 5;
  string api_endpoint = 6;
  string http_method = 7;
  string user_id = 8;       // "Public-User" if unknown
  string trace_id = 9;
  string reason = 10;
}

message WriteAuditResponse {
  bool success = 1;
}
