version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: user_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:5.0
    environment:
      CASSANDRA_START_RPC: "true"
      CASSANDRA_CLUSTER_NAME: "user-platform"
      CASSANDRA_AUTHENTICATOR: "AllowAllAuthenticator"
      CASSANDRA_AUTHORIZER: "AllowAllAuthorizer"
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 20s
      timeout: 10s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: "server -dev -dev-root-token-id=root"
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - ./vault/file:/vault/file
      - ./vault/logs:/vault/logs

  user-service:
    build:
      context: .
      dockerfile: build/Dockerfile.user
    depends_on:
      - postgres
      - cassandra
      - kafka
      - redis
    environment:
      APP_ENV: development

      # --- Postgres ---
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: user_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # --- Cassandra & Kafka ---
      CASSANDRA_HOSTS: cassandra:9042
      CASSANDRA_KEYSPACE: user_platform
      KAFKA_BROKERS: kafka:9092

      # --- Redis ---
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:

      # --- JWT/Token key PATHS ---
      TOKEN_PRIVATE_KEY_PATH: /secrets/jwtRS256.key
      TOKEN_PUBLIC_KEY_PATH: /secrets/jwtRS256.key.pub
      JWT_PRIVATE_KEY_PATH: /secrets/jwtRS256.key
      JWT_PUBLIC_KEY_PATH: /secrets/jwtRS256.key.pub
    ports:
      - "50051:50051"
    volumes:
      - ./secrets:/secrets:ro

  logger-service:
    build:
      context: .
      dockerfile: build/Dockerfile.logger
    depends_on:
      - cassandra
      - kafka
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: user_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      CASSANDRA_HOSTS: cassandra:9042
      CASSANDRA_KEYSPACE: user_platform
      KAFKA_BROKERS: kafka:9092

      TOKEN_PRIVATE_KEY_PATH: /secrets/jwtRS256.key
      TOKEN_PUBLIC_KEY_PATH: /secrets/jwtRS256.key.pub
      JWT_PRIVATE_KEY_PATH: /secrets/jwtRS256.key
      JWT_PUBLIC_KEY_PATH: /secrets/jwtRS256.key.pub
    ports:
      - "50052:50052"
    volumes:
      - ./secrets:/secrets:ro

  gateway:
    build:
      context: .
      dockerfile: build/Dockerfile.gateway
    depends_on:
      - user-service
      - logger-service
    environment:
      USER_SERVICE_HOST: user-service:50051
      USER_SERVICE_ADDR: user-service:50051
      LOGGER_SERVICE_HOST: logger-service:50052
      KAFKA_BROKERS: kafka:9092

      # Postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: user_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # Redis (optional if gateway needs caching too)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
    ports:
      - "8080:8080"

  sonarqube:
    image: sonarqube:25.8.0.112029-community
    container_name: sonarqube
    depends_on:
      - db
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  db:
    image: postgres:15
    container_name: sonardb
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - postgresql:/var/lib/postgresql
      - postgresql_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  cassandra_data:
  redis_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
  postgresql_data:
